# Run nativread-web as its own container on an uncommon, configurable port (48217).
# Jobs (resume) and the household library persist on named volumes across restarts.
services:
  nativread-web:
    build: .
    container_name: nativread-web
    restart: unless-stopped
    ports:
      - "${PORT:-48217}:48217"
    environment:
      APP_PROFILE: "web"
      # Shared household provider key. Leave empty for the zero-cost fake provider.
      TRANSLATION_PROVIDER: "${TRANSLATION_PROVIDER:-fake}"
      PROVIDER_API_KEY: "${PROVIDER_API_KEY:-}"
      PROVIDER_MODEL: "${PROVIDER_MODEL:-}"
      PROVIDER_BASE_URL: "${PROVIDER_BASE_URL:-}"
      PROVIDER_REASONER_MODEL: "${PROVIDER_REASONER_MODEL:-}"
      COST_CEILING_USD: "${COST_CEILING_USD:-10}"
      TRANSLATION_REFINE: "${TRANSLATION_REFINE:-1}"
      TRANSLATION_REFINE_SELECTIVE: "${TRANSLATION_REFINE_SELECTIVE:-1}"
      TRANSLATION_REASONER_HARD: "${TRANSLATION_REASONER_HARD:-1}"
      TRANSLATION_PRECISION: "${TRANSLATION_PRECISION:-balanced}"
      TRANSLATION_CONCURRENCY: "${TRANSLATION_CONCURRENCY:-4}"
      MAX_EPUB_UPLOAD_BYTES: "${MAX_EPUB_UPLOAD_BYTES:-33554432}"
      MAX_EPUB_ENTRIES: "${MAX_EPUB_ENTRIES:-2000}"
      MAX_EPUB_UNCOMPRESSED_BYTES: "${MAX_EPUB_UNCOMPRESSED_BYTES:-134217728}"
      HOSTNAME: "0.0.0.0"
      PORT: "48217"
      JOBS_DIR: "/data/jobs"
      LIBRARY_DIR: "/data/library"
      ENTITLEMENTS_DIR: "/data/entitlements"
    volumes:
      - nativread-web-jobs:/data/jobs
      - nativread-web-library:/data/library
      - nativread-web-entitlements:/data/entitlements

volumes:
  nativread-web-jobs:
  nativread-web-library:
  nativread-web-entitlements:
