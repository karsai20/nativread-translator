# Run quire-translator as its own container on an uncommon, configurable port (48217).
# Jobs (resume) and the household library persist on named volumes across restarts.
services:
  quire-translator:
    build: .
    container_name: quire-translator
    restart: unless-stopped
    ports:
      - "${PORT:-48217}:48217"
    environment:
      # Shared household DeepSeek key. Leave empty for the zero-cost fake provider.
      PROVIDER_API_KEY: "${PROVIDER_API_KEY:-}"
      COST_CEILING_USD: "${COST_CEILING_USD:-10}"
      TRANSLATION_REFINE: "${TRANSLATION_REFINE:-1}"
      HOSTNAME: "0.0.0.0"
      PORT: "48217"
      JOBS_DIR: "/data/jobs"
      LIBRARY_DIR: "/data/library"
    volumes:
      - quire-jobs:/data/jobs
      - quire-library:/data/library

volumes:
  quire-jobs:
  quire-library:
