name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

# Supply-chain floor (blueprint §7): read-only token, SHA-pinned actions.
permissions:
  contents: read
  # gitleaks reads the PR's commit list; without this its scan dies on a 403.
  pull-requests: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    # Free secret-scanning net — GHAS secret scanning is Pro-gated on
    # private repos (blueprint §7).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  test-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.14"
      - run: bun install --frozen-lockfile
      - run: bun test
      - run: bunx tsc --noEmit --incremental false
      # The Worker has its own tsconfig, so the root type-check never saw it —
      # and it is the deployed backend.
      - run: bun run cf:typecheck
      - run: bun run build

  audit:
    # Non-blocking first (blueprint §7); make it required once it runs clean.
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.14"
      - run: bun install --frozen-lockfile
      - run: bun audit
